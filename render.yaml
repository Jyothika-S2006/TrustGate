services:
  - type: web
    name: trustgate-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ARMORIQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
